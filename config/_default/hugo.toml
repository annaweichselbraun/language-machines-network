theme = "congo"
defaultContentLanguage = "en"

# Set this to your registered domain once you have it, e.g. "https://languagemachines.net/"
baseURL = "https://languagemachines.net/"

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 15

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youTube]
    privacyEnhanced = true

[services]
  [services.x]
    disableInlineCSS = true
